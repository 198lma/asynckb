[dependency-groups]
test = [
    'flake8~=6.1',
    'flake8-pyi~=24.1.0',
    'mypy~=1.8.0',
    'pytest',
    'pytest-asyncio>=0.23',
    'SQLAlchemy>=2.0',
    'alembic>=1.13',
]
docs = [
    'Sphinx~=7.4',
    'sphinx_rtd_theme>=1.2.2',
]

[build-system]
requires = [
    "setuptools>=77.0.3",
    "packaging>=24.0",
    "Cython(>=3.2.1,<4.0.0)"
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build-frontend = "build"
test-groups = "test"
skip = "cp38-*"
test-command = "python {project}/tests/__init__.py -m unit -q"

[tool.pytest.ini_options]
addopts = "--capture=no --assert=plain --strict-markers --tb=native --import-mode=importlib"
testpaths = ["tests/kes"]
filterwarnings = "default"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: does not require a running KingbaseES instance",
    "integration: requires running KingbaseES instances",
    "framework: exercises SQLAlchemy or Alembic integration",
]

[tool.coverage.run]
branch = true
plugins = ["Cython.Coverage"]
parallel = true
source = ["asyncpg/", "tests/"]
omit = ["*.pxd"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if debug",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
]
show_missing = true

[tool.mypy]
exclude = [
    "^.eggs",
    "^.github",
    "^.vscode",
    "^build",
    "^dist",
    "^docs",
    "^tests",
]
incremental = true
strict = true
implicit_reexport = true

[[tool.mypy.overrides]]
module = [
    "asyncpg._testbase",
    "asyncpg._testbase.*",
    "asyncpg.cluster",
    "asyncpg.connect_utils",
    "asyncpg.connection",
    "asyncpg.connresource",
    "asyncpg.cursor",
    "asyncpg.exceptions",
    "asyncpg.exceptions.*",
    "asyncpg.pool",
    "asyncpg.prepared_stmt",
    "asyncpg.transaction",
    "asyncpg.utils",
]
ignore_errors = true
