# Modified for asynckb: independent distribution and KES compatibility.
name: CI

on:
  push:
    branches:
      - main
      - ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kes-unit:
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: 1

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install pytest 'pytest-asyncio>=0.23' 'SQLAlchemy>=2.0'
          python -m pip install -e .

      - name: Run KES unit tests
        run: python tests/__init__.py -m unit -q

      - name: Verify test-plan traceability
        run: python tools/tests/test_traceability.py

  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install static-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'flake8~=6.1'

      - name: Run static checks
        run: |
          python tools/check_test_traceability.py
          python -m flake8 asynckb tests/kes
          python -m compileall -q asynckb tests/kes

  regression-tests:
    name: Regression Tests
    needs: [kes-unit, static-checks]
    runs-on: ubuntu-latest

    steps:
      - run: echo OK
